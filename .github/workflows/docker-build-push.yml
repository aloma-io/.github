name: Reusable Docker Build and Push

# MIGRATION CONFIGURATION: feat/migrate-to-reusable-workflow branch
# This branch is configured to push ONLY to Google Cloud Platform (GCP) Artifact Registry
# Azure Container Registry (ACR) pushes are temporarily COMMENTED OUT for migration validation
# Purpose: Ensure all Docker images are available in GCP for Flux repository configuration
# Date: August 11, 2025
# To restore dual-registry push: uncomment the push-azure job below

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the Docker image (without registry prefix)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile or Containerfile'
        required: false
        type: string
        default: 'Containerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      tags:
        description: 'Tags to apply to the image (comma or space separated)'
        required: false
        type: string
        default: 'latest'
      enable-azure:
        description: 'Enable push to Azure Container Registry (DISABLED on migration branch)'
        required: false
        type: boolean
        default: false  # Set to false for GCP-only migration validation
      enable-google:
        description: 'Enable push to Google Artifact Registry'
        required: false
        type: boolean
        default: true
    secrets:
      AZURE_USER:
        description: 'Azure Container Registry username'
        required: false
      AZURE_PASS:
        description: 'Azure Container Registry password'
        required: false
      GOOGLE_CLOUD_KEY:
        description: 'Google Cloud service account key (base64 encoded)'
        required: false
      PAT:
        description: 'Personal Access Token for private repositories'
        required: false

jobs:
  # Build Docker image with caching
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      primary-tag: ${{ steps.build.outputs.primary-tag }}
      all-tags: ${{ steps.build.outputs.all-tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Build Docker image
        id: build
        uses: aloma-io/.github/actions/build@feat/migrate-to-reusable-workflow
        with:
          image_name: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          # Enable GitHub Actions caching
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push to Azure Container Registry
  # TEMPORARILY DISABLED FOR GCP MIGRATION VALIDATION ON feat/migrate-to-reusable-workflow BRANCH
  # This configuration is preserved for future re-enablement after GCP migration is validated
  # To re-enable: uncomment this job and set enable-azure: true in calling workflows
  # push-azure:
  #   if: inputs.enable-azure
  #   needs: docker-build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #       
  #     - name: Push to Azure Container Registry
  #       uses: aloma-io/.github/actions/push-azure@feat/migrate-to-reusable-workflow
  #       with:
  #         image_name: ${{ inputs.image_name }}
  #         source_tag: ${{ needs.docker-build.outputs.primary-tag }}
  #         all_tags: ${{ needs.docker-build.outputs.all-tags }}
  #       env:
  #         AZURE_USER: ${{ secrets.AZURE_USER }}
  #         AZURE_PASS: ${{ secrets.AZURE_PASS }}

  # Push to Google Artifact Registry (parallel with Azure)
  push-google:
    if: inputs.enable-google
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Push to Google Artifact Registry
        uses: aloma-io/.github/actions/push-google@feat/migrate-to-reusable-workflow
        with:
          image_name: ${{ inputs.image_name }}
          source_tag: ${{ needs.docker-build.outputs.primary-tag }}
          all_tags: ${{ needs.docker-build.outputs.all-tags }}
        env:
          GOOGLE_CLOUD_KEY: ${{ secrets.GOOGLE_CLOUD_KEY }}
