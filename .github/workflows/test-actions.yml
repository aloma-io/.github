name: Test build and push actions
# Runs the composite actions in THIS checkout (./actions/*, not @main) against a throwaway registry on localhost:5000.
# Nothing is pushed to aloma.azurecr.io or anywhere real: push-azure is pointed at the local registry through its
# `registry` input, with dummy credentials.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  actions:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: Fixture image
        run: |
          # context '.' on purpose: with another context the build action cannot find the file (see PR description)
          printf 'FROM scratch\nCOPY Containerfile /plat30\n' > Containerfile

      - name: Build action
        id: build
        uses: ./actions/build
        with:
          image_name: plat30-test
          tags: 'v1,stable'
          context: '.'
          dockerfile: Containerfile

      - name: Fixture image in a subfolder (PLAT-41)
        run: |
          mkdir -p sub
          printf 'FROM scratch\nCOPY Containerfile /plat41\n' > sub/Containerfile

      - name: Build action with a context other than '.' (PLAT-41)
        id: build-sub
        uses: ./actions/build
        with:
          image_name: plat41-test
          tags: 'v2'
          context: 'sub'
          dockerfile: Containerfile

      - name: Assert the subfolder build produced its image (PLAT-41)
        env:
          PRIMARY: ${{ steps.build-sub.outputs.primary-tag }}
        run: |
          test "$PRIMARY" = "v2"
          docker image inspect plat41-test:v2 >/dev/null

      - name: Push action (to the local registry)
        uses: ./actions/push-azure
        with:
          image_name: plat30-test
          source_tag: ${{ steps.build.outputs.primary-tag }}
          all_tags: ${{ steps.build.outputs.all-tags }}
          registry: localhost:5000
        env:
          AZURE_USER: dummy
          AZURE_PASS: dummy

      - name: Assert tags, outputs and registry content
        env:
          PRIMARY: ${{ steps.build.outputs.primary-tag }}
          ALL: ${{ steps.build.outputs.all-tags }}
        run: bash tests/assert-tags.sh
